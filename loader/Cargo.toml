[package]
name = "tee-demo-loader"
version = "0.1.0"
edition = "2021"
description = "SGX loader with HostService multiplexer (loader.* + host leg forwarding)"

[[bin]]
name = "tee-demo-loader"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", features = ["compat", "io-compat"] }
tokio = { version = "1", features = ["full"] }
sgxs = "=0.8.0"
tee-demo-protocol = { path = "../protocol" }
base64 = "0.22"
serde_json = "1"
sgx-isa = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
aesm-client = { version = "=0.6.0", features = ["sgxs"] }
enclave-runner = "=0.7.0"
sgxs-loaders = "=0.5.0"
