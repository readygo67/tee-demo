[package]
name = "tee-demo-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared length-prefixed JSON frames for tee-demo Host/Loader/Runtime"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hpke = { version = "0.12", default-features = false, features = ["alloc", "p256"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[features]
default = ["std"]
std = []
verify = ["dep:dcap-qvl", "dep:tokio"]

[dependencies.dcap-qvl]
version = "0.6"
optional = true
default-features = false
features = ["std", "report", "rustcrypto", "default-x509"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt-multi-thread", "macros"]
