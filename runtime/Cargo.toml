[package]
name = "tee-demo"
version = "0.1.0"
edition = "2021"
description = "SGX Runtime (tee-demo) — compute + attestation"

[dependencies]
tee-demo-protocol = { path = "../protocol" }
sgx-isa = { version = "0.4", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.2"

[package.metadata.fortanix-sgx]
heap-size = 0x2000000
stack-size = 0x40000
threads = 1
debug = false
